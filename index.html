<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smartphone Notification</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="smartphone">
        <div id="screen">
            <div id="background">
                <div id="notification">
                    <div class="notif-glass">
                        <div class="notif-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round"
                                class="lucide lucide-message-square-text-icon lucide-message-square-text">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                                <path d="M13 8H7" />
                                <path d="M17 12H7" />
                            </svg>
                        </div>
                        <span class="notif-text">Nouveau message</span>
                    </div>
                </div>
                <div id="status-icons">
                    <!-- Batterie -->
                    <div class="status-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-battery-full-icon lucide-battery-full">
                            <rect width="16" height="10" x="2" y="7" rx="2" ry="2" />
                            <line x1="22" x2="22" y1="11" y2="13" />
                            <line x1="6" x2="6" y1="11" y2="13" />
                            <line x1="10" x2="10" y1="11" y2="13" />
                            <line x1="14" x2="14" y1="11" y2="13" />
                        </svg>
                    </div>
                    <!-- Wi-Fi -->
                    <div class="status-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-wifi-icon lucide-wifi">
                            <path d="M12 20h.01" />
                            <path d="M2 8.82a15 15 0 0 1 20 0" />
                            <path d="M5 12.859a10 10 0 0 1 14 0" />
                            <path d="M8.5 16.429a5 5 0 0 1 7 0" />
                        </svg>
                    </div>
                    <!-- Réseau -->
                    <div class="status-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-signal-high-icon lucide-signal-high">
                            <path d="M2 20h.01" />
                            <path d="M7 20v-4" />
                            <path d="M12 20v-8" />
                            <path d="M17 20V8" />
                        </svg>
                    </div>
                </div>

                <div id="time">13:37</div>
                <div id="date">Dimanche, 19 Décembre</div>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
